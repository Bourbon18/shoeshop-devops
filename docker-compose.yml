services:
  db:
    image: mysql:5.7
    container_name: shoeshop-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shoeshop
      MYSQL_USER: shoeshop
      MYSQL_PASSWORD: "1234"
    ports:
      - "3307:3306"
    volumes:
      - ./shoe_shopdb.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: shoeshop-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/shoeshop?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: shoeshop
      SPRING_DATASOURCE_PASSWORD: "1234"
    ports:
      - "88:8080"

volumes:
  db-data:
